name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Job to build and test the Frontend (React)
  test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use your Node.js version

      # 3. Install dependencies and Build the project
      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      # 4. Run all unit tests
      - name: Run Tests
        run: npm test -- --watchAll=false

  # Job to test the Backend (Node.js)
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: test-frontend # This ensures the backend job runs only if the frontend job succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. Install backend dependencies
      - name: Install Dependencies
        run: npm ci
        working-directory: ./backend/Server # 👈 Change this path to your backend directory

      # 6. Run backend tests (if you have them)
      - name: Run Backend Tests
        run: npm test
        working-directory: ./backend/Server # 👈 Change this path to your backend directory
        # If you don't have tests, you can comment this step out or remove it.